name: Personal macOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Personal builds use an ad-hoc signature and need no Apple or updater
      # secrets. The override applies only to this build, not official releases.
      - name: Build personal DMG
        run: >-
          npm run tauri:build --
          --target aarch64-apple-darwin
          --bundles dmg
          --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'

      # Tauri removes the temporary .app when only DMG is requested.
      # Verify the application inside the installer that will be downloaded.
      - name: Verify packaged application signature
        run: |
          set -euo pipefail
          DMG_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          DMG_PATH="$(find "$DMG_DIR" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          MOUNT_PATH="$RUNNER_TEMP/personal-dmg"
          mkdir -p "$MOUNT_PATH"
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_PATH" -readonly -nobrowse
          trap 'hdiutil detach "$MOUNT_PATH"' EXIT
          codesign --verify --deep --strict --verbose=2 "$MOUNT_PATH/skills-manager.app"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: skills-manager-macOS-arm64-${{ github.sha }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
